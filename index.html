<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OWNLN — Own Your Music. Own Your Future.</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #050505; display: flex; justify-content: center; align-items: flex-start; font-family: system-ui, -apple-system, sans-serif; }
    #root { width: 390px; min-height: 100vh; background: #0A0A0A; color: #FFFFFF; position: relative; overflow: hidden; border-left: 1px solid #171717; border-right: 1px solid #171717; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 10px #D4AF3755; } 50% { box-shadow: 0 0 24px #D4AF3790; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── DESIGN TOKENS ─────────────────────── */
const C = {
  bg:'#0A0A0A', card:'#141414', card2:'#1A1A1A',
  gold:'#D4AF37', goldDim:'#D4AF3760', goldBg:'#1D1602',
  text:'#FFFFFF', muted:'#888888', line:'#252525',
  success:'#59B17A', danger:'#D26A6A', blue:'#4A9EFF',
};

/* ── SAMPLE DATA ───────────────────────── */
const TRACKS = [
  { id:1, title:'Midnight Gold', artist:'Marcus Allen', plays:'2.4M', duration:'3:47', mood:'Late Night', genre:'R&B' },
  { id:2, title:'Echoes',        artist:'Marcus Allen', plays:'1.8M', duration:'4:12', mood:'Reflective', genre:'Soul' },
  { id:3, title:'Sovereign',     artist:'Maya Quinn',   plays:'1.2M', duration:'3:58', mood:'Hype',       genre:'Hip-Hop' },
  { id:4, title:'Undivided',     artist:'Ari Vega',     plays:'980K', duration:'4:33', mood:'Chill',      genre:'Neo-Soul' },
  { id:5, title:'Renegade Sun',  artist:'Noah Lane',    plays:'760K', duration:'3:22', mood:'Focus',      genre:'Afrobeats' },
];
const MOODS = ['For You','Chill','Hype','Late Night','Heartbreak','Focus','Film Score','Soulful'];
const GENRES = ['R&B','Soul','Hip-Hop','Afrobeats','Neo-Soul','Gospel','Jazz','Pop'];
const PODCAST_SHOWS = [
  { id:1, title:'The Creator Blueprint', host:'Marcus Allen', episodes:24, description:'Conversations on music ownership, distribution, and independent artist success.' },
  { id:2, title:'Frequency Sessions',    host:'Maya Quinn',   episodes:18, description:'Deep dive producer sessions — from first loop to final master.' },
];
const PODCAST_EPISODES = [
  { id:1, showId:1, season:2, ep:6, title:'Owning Your Masters in 2025',  duration:'54:12', summary:'Marcus and guests break down why owning your masters is the single biggest move you can make as an independent artist.', free:true },
  { id:2, showId:1, season:2, ep:5, title:'Sync Licensing 101',            duration:'48:30', summary:'How to land TV, film, and ad placements to build passive income.', free:true },
  { id:3, showId:1, season:2, ep:4, title:'Publishing Deals Explained',    duration:'62:00', summary:'Exclusive deep dive into publishing splits, PROs, and sub-publishing.', free:false },
  { id:4, showId:1, season:1, ep:8, title:'Starting From Zero: The Story', duration:'39:45', summary:'Origin story. How Marcus went from bedroom producer to independent label owner.', free:true },
];
const TXS = [
  { id:1, title:'Fan subscriptions', amount:'+$340.00', date:'Jun 1',  type:'in',  source:'subscriptions' },
  { id:2, title:'Stream royalties',  amount:'+$284.00', date:'May 28', type:'in',  source:'streaming' },
  { id:3, title:'Track purchases',   amount:'+$96.00',  date:'May 25', type:'in',  source:'purchases' },
  { id:4, title:'Merch sales',       amount:'+$128.00', date:'May 22', type:'in',  source:'merch' },
  { id:5, title:'Ad revenue share',  amount:'+$44.00',  date:'May 18', type:'in',  source:'ads' },
  { id:6, title:'Payout sent',       amount:'-$750.00', date:'May 1',  type:'out', source:'payout' },
];

/* ── BASE STYLES ───────────────────────── */
const B = {
  screen:{ minHeight:'100vh', background:C.bg, color:C.text, display:'flex', flexDirection:'column', animation:'rise .18s ease' },
  scroll:{ flex:1, overflowY:'auto', paddingBottom:'88px' },
  card:{ background:C.card, border:`1px solid ${C.line}`, borderRadius:14 },
  goldCard:{ background:`linear-gradient(135deg,${C.goldBg},${C.card2} 60%,#101010)`, border:`1px solid ${C.goldDim}`, borderRadius:14 },
  title:{ fontSize:16, fontWeight:800, marginBottom:10 },
  goldBtn:{ background:C.gold, color:C.bg, border:'none', borderRadius:24, padding:'12px 18px', fontWeight:800, cursor:'pointer', fontSize:14 },
  outlineBtn:{ background:'transparent', color:C.gold, border:`1px solid ${C.goldDim}`, borderRadius:24, padding:'10px 14px', fontWeight:700, cursor:'pointer', fontSize:13 },
  ghostBtn:{ background:'transparent', color:C.muted, border:`1px solid ${C.line}`, borderRadius:24, padding:'8px 12px', fontWeight:600, cursor:'pointer', fontSize:12 },
  input:{ width:'100%', background:'#111', color:C.text, border:`1px solid ${C.line}`, borderRadius:12, padding:'12px 14px', outline:'none', fontSize:14 },
  top:{ padding:'48px 16px 12px' },
  pill:{ borderRadius:99, padding:'5px 12px', fontSize:11, fontWeight:700, cursor:'pointer' },
};

/* ── SHARED COMPONENTS ─────────────────── */
const Header = ({ title, subtitle, onBack, right }) => (
  <div style={{ ...B.top, display:'flex', alignItems:'center', gap:10 }}>
    {onBack && <button onClick={onBack} style={{ width:34, height:34, borderRadius:99, border:`1px solid ${C.line}`, background:'#151515', color:C.text, cursor:'pointer', flexShrink:0 }}>←</button>}
    <div style={{ flex:1 }}>
      <div style={{ fontSize:19, fontWeight:900 }}>{title}</div>
      {subtitle && <div style={{ color:C.muted, fontSize:12, marginTop:1 }}>{subtitle}</div>}
    </div>
    {right}
  </div>
);

const StatusBar = () => (
  <div style={{ display:'flex', justifyContent:'space-between', color:C.muted, fontSize:11, padding:'8px 18px 0' }}>
    <span>9:41</span><span>5G ▪ 89%</span>
  </div>
);

const Tag = ({ label, active, onClick }) => (
  <span onClick={onClick} style={{ ...B.pill, background: active ? C.gold : C.card, color: active ? C.bg : C.muted, border: active ? 'none' : `1px solid ${C.line}`, display:'inline-block' }}>{label}</span>
);

const TrackRow = ({ track, onPlay, showLike }) => {
  const [liked, setLiked] = React.useState(false);
  return (
    <div style={{ ...B.card, padding:'10px 12px', marginBottom:8, display:'flex', alignItems:'center', gap:10, cursor:'pointer' }} onClick={onPlay}>
      <div style={{ width:44, height:44, borderRadius:10, background:`linear-gradient(135deg,${C.goldDim},#111)`, display:'grid', placeItems:'center', flexShrink:0, color:C.gold, fontSize:15 }}>▶</div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:13, fontWeight:700, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{track.title}</div>
        <div style={{ color:C.muted, fontSize:11 }}>{track.artist} · {track.plays} plays</div>
      </div>
      <div style={{ display:'flex', gap:8, alignItems:'center', flexShrink:0 }}>
        {showLike && <span onClick={e=>{ e.stopPropagation(); setLiked(!liked); }} style={{ fontSize:16, cursor:'pointer', color: liked ? C.gold : C.muted }}>{liked ? '♥' : '♡'}</span>}
        <span style={{ color:C.muted, fontSize:11 }}>{track.duration}</span>
      </div>
    </div>
  );
};

const BottomNav = ({ screen, setScreen, role }) => {
  const tabs = role === 'artist'
    ? [{ id:'home', icon:'⌂', label:'Home' },{ id:'search', icon:'⌕', label:'Discover' },{ id:'library', icon:'▤', label:'Studio' },{ id:'community', icon:'◎', label:'Community' },{ id:'artist', icon:'◉', label:'Profile' }]
    : [{ id:'home', icon:'⌂', label:'Home' },{ id:'search', icon:'⌕', label:'Discover' },{ id:'library', icon:'▤', label:'Library' },{ id:'community', icon:'◎', label:'Community' },{ id:'fanprofile', icon:'◉', label:'Me' }];
  return (
    <div style={{ position:'fixed', bottom:0, width:390, background:C.card2, borderTop:`1px solid ${C.line}`, padding:'8px 0 14px', display:'flex', justifyContent:'space-around', zIndex:20 }}>
      {tabs.map(t => {
        const active = t.id === screen;
        return <div key={t.id} onClick={() => setScreen(t.id)} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2, color:active ? C.gold : C.muted, fontSize:10, fontWeight:700, cursor:'pointer' }}>
          <span style={{ fontSize:18 }}>{t.icon}</span><span>{t.label}</span>
        </div>;
      })}
    </div>
  );
};

/* ══════════════════════════════════════════════════
   AUTH FLOW: Login/Signup → Role Selection
══════════════════════════════════════════════════ */
const AuthScreen = ({ onDone }) => {
  const [step, setStep] = React.useState('auth');
  const [mode, setMode] = React.useState('login');
  const [role, setRole] = React.useState(null);

  if (step === 'role') return (
    <div style={{ ...B.screen, background:'radial-gradient(circle at 30% 20%,#1A1404 0%,#0A0A0A 50%)' }}>
      <StatusBar />
      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'18px 22px 32px' }}>
        <div style={{ textAlign:'center', marginTop:24, marginBottom:32 }}>
          <div style={{ fontSize:34, fontWeight:900, letterSpacing:.5 }}><span style={{ color:C.gold }}>OWN</span>LN</div>
          <div style={{ color:C.muted, fontSize:13, marginTop:6 }}>How will you use OWNLN?</div>
        </div>
        <div style={{ display:'grid', gap:12 }}>
          {[
            { id:'fan', icon:'🎧', title:"I'm a Fan", sub:'Discover music, support artists, build your collection', badge:'Free · Always' },
            { id:'artist', icon:'🎤', title:"I'm a Creator", sub:'Upload music, earn 80–90% royalties, grow your audience', badge:'Free + Pro Plans' },
          ].map(r => (
            <div key={r.id} onClick={() => setRole(r.id)} style={{ ...B.card, padding:18, border: role === r.id ? `1px solid ${C.gold}` : `1px solid ${C.line}`, background: role === r.id ? C.goldBg : C.card, cursor:'pointer' }}>
              <div style={{ display:'flex', gap:12, alignItems:'flex-start' }}>
                <span style={{ fontSize:28 }}>{r.icon}</span>
                <div style={{ flex:1 }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    <div style={{ fontWeight:800, fontSize:16 }}>{r.title}</div>
                    <span style={{ fontSize:10, color: role === r.id ? C.gold : C.muted, fontWeight:700 }}>{r.badge}</span>
                  </div>
                  <div style={{ color:C.muted, fontSize:12, marginTop:4 }}>{r.sub}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
        <button onClick={() => role && onDone(role)} disabled={!role} style={{ ...B.goldBtn, width:'100%', marginTop:'auto', paddingTop:14, paddingBottom:14, opacity: role ? 1 : .4, animation:'glow 2s ease infinite' }}>
          Continue as {role === 'artist' ? 'Creator' : role === 'fan' ? 'Fan' : '...'}
        </button>
      </div>
    </div>
  );

  return (
    <div style={{ ...B.screen, background:'radial-gradient(circle at 50% 10%,#1A1404 0%,#0A0A0A 50%)' }}>
      <StatusBar />
      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'14px 22px 28px' }}>
        <div style={{ textAlign:'center', marginTop:20, marginBottom:20 }}>
          <div style={{ fontSize:44, fontWeight:900, letterSpacing:.8 }}><span style={{ color:C.gold }}>OWN</span>LN</div>
          <div style={{ color:C.muted, fontSize:12, marginTop:6 }}>Where creators own their music and future</div>
        </div>
        <div style={{ ...B.card, borderColor:C.goldDim, padding:8, marginBottom:14, display:'flex', gap:6 }}>
          {['login','signup'].map(m => (
            <button key={m} onClick={() => setMode(m)} style={{ flex:1, border: mode===m ? `1px solid ${C.gold}` : '1px solid transparent', background: mode===m ? C.goldBg : '#111', color: mode===m ? C.gold : C.muted, borderRadius:10, padding:'11px 0', fontWeight:800, cursor:'pointer', fontSize:14 }}>
              {m === 'login' ? 'Log In' : 'Sign Up'}
            </button>
          ))}
        </div>
        <div style={{ ...B.card, padding:18 }}>
          <div style={{ fontWeight:800, fontSize:16, marginBottom:2 }}>{mode==='login' ? 'Welcome back' : 'Create your account'}</div>
          <div style={{ color:C.muted, fontSize:12, marginBottom:14 }}>{mode==='login' ? 'Continue your journey' : 'Fans listen free. Creators earn 80–90%.'}</div>
          <div style={{ display:'grid', gap:10 }}>
            {mode === 'signup' && <input style={B.input} placeholder="Full name" />}
            <input style={B.input} placeholder="Email address" type="email" />
            <input style={B.input} placeholder="Password" type="password" />
            {mode === 'signup' && <input style={B.input} placeholder="Confirm password" type="password" />}
          </div>
          {mode === 'login' && <div style={{ textAlign:'right', marginTop:8, fontSize:11, color:C.muted, cursor:'pointer' }}>Forgot password?</div>}
          <button onClick={() => setStep('role')} style={{ ...B.goldBtn, width:'100%', marginTop:14, animation:'glow 2s ease infinite' }}>
            {mode === 'login' ? 'Continue' : 'Create Account'}
          </button>
          <div style={{ display:'flex', alignItems:'center', gap:8, margin:'14px 0', color:C.muted, fontSize:10 }}>
            <span style={{ flex:1, height:1, background:C.line }}></span><span>OR</span><span style={{ flex:1, height:1, background:C.line }}></span>
          </div>
          <button style={{ ...B.ghostBtn, width:'100%' }}>🔵 Continue with Google</button>
        </div>
        <div style={{ marginTop:14, textAlign:'center', color:C.muted, fontSize:10 }}>By continuing you agree to our Terms of Service & Privacy Policy</div>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════
   FAN HOME
══════════════════════════════════════════════════ */
const FanHomeScreen = ({ setScreen, setTrack }) => {
  const [activeMood, setActiveMood] = React.useState('For You');
  return (
    <div style={B.screen}>
      <div style={{ ...B.top, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ fontSize:26, fontWeight:900 }}><span style={{ color:C.gold }}>OWN</span>LN</div>
        <div style={{ display:'flex', gap:8 }}>
          <button onClick={() => setScreen('fansaved')} style={{ width:34, height:34, borderRadius:99, border:`1px solid ${C.line}`, background:C.card, color:C.text, cursor:'pointer', fontSize:14 }}>♡</button>
          <button onClick={() => setScreen('notifications')} style={{ width:34, height:34, borderRadius:99, border:`1px solid ${C.line}`, background:C.card, color:C.gold, cursor:'pointer' }}>🔔</button>
        </div>
      </div>
      <div style={B.scroll}>
        <div style={{ padding:'0 16px 14px' }}>
          <div style={{ display:'flex', gap:8, overflowX:'auto', paddingBottom:4 }}>
            {MOODS.map(m => <Tag key={m} label={m} active={activeMood===m} onClick={() => setActiveMood(m)} />)}
          </div>
        </div>
        <div style={{ padding:'0 16px 16px' }}>
          <div style={{ ...B.goldCard, padding:18 }}>
            <div style={{ color:C.gold, fontSize:10, fontWeight:800, letterSpacing:1 }}>🔥 TRENDING NOW</div>
            <div style={{ fontSize:22, fontWeight:900, marginTop:4 }}>Midnight Gold</div>
            <div style={{ color:C.muted, fontSize:12, marginTop:2 }}>Marcus Allen · 2.4M plays</div>
            <div style={{ display:'flex', gap:8, marginTop:12 }}>
              <button onClick={() => { setTrack(TRACKS[0]); setScreen('player'); }} style={{ ...B.goldBtn, flex:1, padding:'10px 0', animation:'glow 2s ease infinite' }}>▶ Play</button>
              <button onClick={() => setScreen('subscribe')} style={{ ...B.outlineBtn, flex:1, padding:'10px 0' }}>Subscribe</button>
            </div>
          </div>
        </div>
        <div style={{ padding:'0 16px 16px' }}>
          <div style={B.title}>Browse by Genre</div>
          <div style={{ display:'flex', gap:8, overflowX:'auto', paddingBottom:4 }}>
            {GENRES.map(g => <div key={g} style={{ ...B.card, padding:'8px 14px', minWidth:'fit-content', cursor:'pointer', fontSize:12, fontWeight:700 }}>{g}</div>)}
          </div>
        </div>
        <div style={{ padding:'0 16px' }}>
          <div style={B.title}>{activeMood === 'For You' ? 'For You' : `${activeMood} Picks`}</div>
          {TRACKS.map(t => <TrackRow key={t.id} track={t} showLike onPlay={() => { setTrack(t); setScreen('player'); }} />)}
        </div>
        <div style={{ padding:'16px 16px 0' }}>
          <div style={B.title}>New From Artists You Follow</div>
          <div style={{ display:'flex', gap:10, overflowX:'auto', paddingBottom:8 }}>
            {TRACKS.slice(0,4).map(t => (
              <div key={t.id} onClick={() => { setTrack(t); setScreen('player'); }} style={{ ...B.card, minWidth:120, padding:10, cursor:'pointer' }}>
                <div style={{ height:54, borderRadius:8, background:`linear-gradient(135deg,${C.goldDim},#111)`, display:'grid', placeItems:'center', marginBottom:6, color:C.gold, fontSize:18 }}>▶</div>
                <div style={{ fontSize:11, fontWeight:700 }}>{t.title}</div>
                <div style={{ color:C.muted, fontSize:10 }}>{t.artist}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{ padding:'16px 16px 0' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
            <div style={B.title}>Top Podcasts</div>
            <span onClick={() => setScreen('podcast')} style={{ color:C.gold, fontSize:12, cursor:'pointer' }}>See all</span>
          </div>
          {PODCAST_SHOWS.map(s => (
            <div key={s.id} onClick={() => setScreen('podcast')} style={{ ...B.card, padding:12, marginBottom:8, cursor:'pointer' }}>
              <div style={{ fontWeight:700, fontSize:13 }}>{s.title}</div>
              <div style={{ color:C.muted, fontSize:11, marginTop:2 }}>by {s.host} · {s.episodes} episodes</div>
            </div>
          ))}
        </div>
      </div>
      <BottomNav screen="home" setScreen={setScreen} role="fan" />
    </div>
  );
};

/* ══════════════════════════════════════════════════
   ARTIST HOME
══════════════════════════════════════════════════ */
const ArtistHomeScreen = ({ setScreen, setTrack }) => (
  <div style={B.screen}>
    <div style={{ ...B.top, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
      <div>
        <div style={{ fontSize:13, color:C.muted }}>Good evening,</div>
        <div style={{ fontSize:22, fontWeight:900 }}>Marcus Allen 👋</div>
      </div>
      <div style={{ display:'flex', gap:8 }}>
        <button onClick={() => setScreen('upload')} style={{ ...B.goldBtn, padding:'8px 14px', fontSize:12 }}>+ Upload</button>
        <button onClick={() => setScreen('notifications')} style={{ width:34, height:34, borderRadius:99, border:`1px solid ${C.line}`, background:C.card, color:C.gold, cursor:'pointer' }}>🔔</button>
      </div>
    </div>
    <div style={B.scroll}>
      <div style={{ padding:'0 16px 14px' }}>
        <div style={{ ...B.goldCard, padding:14 }}>
          <div style={{ color:C.gold, fontSize:10, fontWeight:800, letterSpacing:1 }}>PERFORMANCE SCORE</div>
          <div style={{ display:'flex', alignItems:'flex-end', gap:8, marginTop:4 }}>
            <div style={{ fontSize:38, fontWeight:900, color:C.gold }}>87.4</div>
            <div style={{ color:C.success, fontSize:12, marginBottom:6 }}>↑ +2.1 this week</div>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:6, marginTop:10 }}>
            {[['48.2K','Streams'],['124K','Followers'],['$892','This Month'],['38','New Fans']].map(([v,l]) => (
              <div key={l} style={{ background:'#0A0A0A', borderRadius:10, padding:8, textAlign:'center' }}>
                <div style={{ fontWeight:900, fontSize:13 }}>{v}</div>
                <div style={{ color:C.muted, fontSize:9, marginTop:1 }}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div style={{ padding:'0 16px 14px' }}>
        <div style={{ ...B.card, padding:14, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div>
            <div style={{ color:C.muted, fontSize:11 }}>Available to Withdraw</div>
            <div style={{ fontSize:28, fontWeight:900, color:C.gold }}>$1,840</div>
          </div>
          <button onClick={() => setScreen('wallet')} style={B.goldBtn}>Withdraw</button>
        </div>
      </div>
      <div style={{ padding:'0 16px 14px' }}>
        <div style={B.title}>Revenue Breakdown</div>
        <div style={{ ...B.card, padding:14 }}>
          {[
            { label:'Streaming Royalties', amount:'$284', pct:32, color:C.gold },
            { label:'Fan Subscriptions',   amount:'$340', pct:38, color:'#59B17A' },
            { label:'Merch Sales',         amount:'$128', pct:14, color:'#4A9EFF' },
            { label:'Track Purchases',     amount:'$96',  pct:11, color:'#C47AFF' },
            { label:'Ad Revenue Share',    amount:'$44',  pct:5,  color:'#FF8C42' },
          ].map(r => (
            <div key={r.label} style={{ marginBottom:10 }}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
                <span style={{ fontSize:12, color:C.text }}>{r.label}</span>
                <span style={{ fontSize:12, fontWeight:700, color:r.color }}>{r.amount}</span>
              </div>
              <div style={{ height:5, borderRadius:3, background:C.line }}>
                <div style={{ width:`${r.pct}%`, height:'100%', background:r.color, borderRadius:3 }}></div>
              </div>
            </div>
          ))}
          <div style={{ marginTop:6, fontSize:11, color:C.muted, textAlign:'center' }}>You keep <span style={{ color:C.gold, fontWeight:800 }}>80–90%</span> of every dollar earned</div>
        </div>
      </div>
      <div style={{ padding:'0 16px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
          <div style={B.title}>My Tracks</div>
          <span onClick={() => setScreen('artist')} style={{ color:C.gold, fontSize:12, cursor:'pointer' }}>View all</span>
        </div>
        {TRACKS.slice(0,3).map(t => <TrackRow key={t.id} track={t} onPlay={() => { setTrack(t); setScreen('player'); }} />)}
      </div>
    </div>
    <BottomNav screen="home" setScreen={setScreen} role="artist" />
  </div>
);

/* ══════════════════════════════════════════════════
   DISCOVER / SEARCH
══════════════════════════════════════════════════ */

const PodcastScreen = ({ setScreen, role }) => {
  const [view, setView] = React.useState('shows');
  const [show, setShow] = React.useState(null);
  const [episode, setEpisode] = React.useState(null);
  const [activeSeason, setActiveSeason] = React.useState(2);

  if (view === 'detail' && episode) return (
    <div style={B.screen}>
      <Header title={episode.title} subtitle={`S${episode.season} · E${episode.ep} · ${episode.duration}`} onBack={() => setView('episodes')} />
      <div style={{ ...B.scroll, padding:'0 16px 24px' }}>
        <div style={{ ...B.goldCard, padding:14, marginBottom:14 }}>
          <div style={{ display:'flex', gap:10, alignItems:'center' }}>
            {!episode.free && <span style={{ ...B.pill, background:C.gold, color:C.bg, fontSize:10 }}>PRO</span>}
            {episode.free && <span style={{ ...B.pill, background:'#1A2A1A', color:C.success, border:`1px solid ${C.success}`, fontSize:10 }}>FREE</span>}
            <span style={{ color:C.muted, fontSize:11 }}>{episode.duration}</span>
          </div>
          <div style={{ fontSize:18, fontWeight:800, marginTop:8 }}>{episode.title}</div>
          <div style={{ color:C.muted, fontSize:12, marginTop:4 }}>{show && show.title}</div>
        </div>
        <div style={{ ...B.card, padding:14, marginBottom:14 }}>
          <div style={{ fontWeight:700, marginBottom:6 }}>Episode Summary</div>
          <div style={{ color:C.muted, fontSize:13, lineHeight:1.6 }}>{episode.summary}</div>
        </div>
        {episode.free
          ? <button style={{ ...B.goldBtn, width:'100%', animation:'glow 2s ease infinite' }}>▶ Play Full Episode</button>
          : <div>
              <div style={{ ...B.card, padding:12, marginBottom:10, borderColor:C.goldDim }}>
                <div style={{ color:C.gold, fontWeight:700 }}>Pro Exclusive</div>
                <div style={{ color:C.muted, fontSize:12, marginTop:4 }}>Subscribe to unlock this and all exclusive episodes.</div>
              </div>
              <button onClick={() => setScreen('subscribe')} style={{ ...B.goldBtn, width:'100%' }}>Unlock with Pro Subscription</button>
              <button style={{ ...B.ghostBtn, width:'100%', marginTop:8 }}>▶ Preview Clip (2 min)</button>
            </div>}
      </div>
    </div>
  );

  if (view === 'episodes' && show) {
    const seasons = [...new Set(PODCAST_EPISODES.filter(e => e.showId === show.id).map(e => e.season))].sort((a,b) => b-a);
    const eps = PODCAST_EPISODES.filter(e => e.showId === show.id && e.season === activeSeason);
    return (
      <div style={B.screen}>
        <Header title={show.title} subtitle={`by ${show.host} · ${show.episodes} episodes`} onBack={() => setView('shows')} />
        <div style={{ ...B.scroll, padding:'0 16px 24px' }}>
          <div style={{ ...B.goldCard, padding:12, marginBottom:14 }}>
            <div style={{ color:C.muted, fontSize:12 }}>{show.description}</div>
            <div style={{ display:'flex', gap:8, marginTop:10 }}>
              <button style={{ ...B.goldBtn, flex:1, padding:'9px 0' }}>▶ Play Latest</button>
              <button style={{ ...B.outlineBtn, flex:1, padding:'9px 0' }}>+ Follow Show</button>
            </div>
          </div>
          <div style={{ marginBottom:12 }}>
            <div style={{ fontWeight:700, fontSize:13, marginBottom:8 }}>Season</div>
            <div style={{ display:'flex', gap:8 }}>
              {seasons.map(s => <Tag key={s} label={`Season ${s}`} active={activeSeason===s} onClick={() => setActiveSeason(s)} />)}
            </div>
          </div>
          <div style={B.title}>Episodes — Season {activeSeason}</div>
          {eps.map(ep => (
            <div key={ep.id} onClick={() => { setEpisode(ep); setView('detail'); }} style={{ ...B.card, padding:12, marginBottom:8, cursor:'pointer' }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                <div style={{ flex:1 }}>
                  <div style={{ display:'flex', gap:6, marginBottom:4 }}>
                    <span style={{ color:C.muted, fontSize:11 }}>E{ep.ep}</span>
                    {!ep.free && <span style={{ ...B.pill, background:C.goldBg, color:C.gold, fontSize:9, padding:'2px 7px' }}>PRO</span>}
                  </div>
                  <div style={{ fontSize:13, fontWeight:700 }}>{ep.title}</div>
                  <div style={{ color:C.muted, fontSize:11, marginTop:2 }}>{ep.duration}</div>
                </div>
                <span style={{ color:C.gold, fontSize:18 }}>▶</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div style={B.screen}>
      <Header title="Podcasts & Film" subtitle="Long-form audio & video storytelling" onBack={() => setScreen('library')} />
      <div style={{ ...B.scroll, padding:'0 16px 24px' }}>
        <div style={{ ...B.card, padding:11, marginBottom:14 }}>
          <div style={{ color:C.muted, fontSize:12 }}>Creator-hosted shows, behind-the-scenes series, and documentary-style films. Free episodes for all. Exclusive content for subscribers.</div>
        </div>
        <div style={B.title}>All Shows</div>
        {PODCAST_SHOWS.map(s => (
          <div key={s.id} onClick={() => { setShow(s); setView('episodes'); }} style={{ ...B.card, padding:14, marginBottom:10, cursor:'pointer' }}>
            <div style={{ display:'flex', gap:12, alignItems:'center' }}>
              <div style={{ width:54, height:54, borderRadius:12, background:`linear-gradient(135deg,${C.goldDim},#111)`, display:'grid', placeItems:'center', flexShrink:0, color:C.gold, fontSize:20 }}>🎙</div>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:800, fontSize:14 }}>{s.title}</div>
                <div style={{ color:C.muted, fontSize:12, marginTop:2 }}>Hosted by {s.host}</div>
                <div style={{ color:C.muted, fontSize:11, marginTop:1 }}>{s.episodes} episodes · Multiple seasons</div>
              </div>
              <span style={{ color:C.gold }}>›</span>
            </div>
          </div>
        ))}
        {role === 'artist' && (
          <div style={{ marginTop:10 }}>
            <div style={B.title}>Your Shows</div>
            <button onClick={() => setScreen('upload')} style={{ ...B.outlineBtn, width:'100%' }}>+ Create New Show</button>
          </div>
        )}
      </div>
      <BottomNav screen="library" setScreen={setScreen} role={role} />
    </div>
  );
};

/* ══════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════ */
const App = () => {
  const [authed, setAuthed] = React.useState(false);
  const [role, setRole] = React.useState(null);
  const [screen, setScreen] = React.useState('home');
  const [track, setTrack] = React.useState(TRACKS[0]);

  const logout = () => { setAuthed(false); setRole(null); setScreen('home'); };

  if (!authed) return <AuthScreen onDone={r => { setRole(r); setAuthed(true); setScreen('home'); }} />;

  const sp = { setScreen, setTrack, role };

  const routes = {
    home:         role === 'artist' ? <ArtistHomeScreen {...sp} /> : <FanHomeScreen {...sp} />,
    search:       <SearchScreen {...sp} />,
    library:      role === 'artist' ? <ArtistLibraryScreen {...sp} /> : <FanLibraryScreen {...sp} />,
    community:    <CommunityScreen {...sp} />,
    artist:       <ArtistScreen setScreen={setScreen} setTrack={setTrack} />,
    fanprofile:   <FanProfileScreen setScreen={setScreen} />,
    artistpublic: <ArtistPublicScreen setScreen={setScreen} setTrack={setTrack} />,
    player:       <PlayerScreen setScreen={setScreen} track={track} role={role} />,
    opi:          <OpiScreen setScreen={setScreen} />,
    wallet:       <WalletScreen setScreen={setScreen} />,
    subscribe:    <SubscribeScreen setScreen={setScreen} role={role} />,
    upload:       <UploadScreen setScreen={setScreen} />,
    streamingops: <StreamingOpsScreen setScreen={setScreen} />,
    podcast:      <PodcastScreen setScreen={setScreen} role={role} />,
    education:    <EducationScreen setScreen={setScreen} />,
    merch:        <MerchScreen setScreen={setScreen} />,
    approval:     <ApprovalQueueScreen setScreen={setScreen} />,
    features:     <FeaturesScreen setScreen={setScreen} />,
    fanfare:      <FanfareScreen setScreen={setScreen} />,
    networking:   <NetworkingScreen setScreen={setScreen} />,
    notifications:<NotificationsScreen setScreen={setScreen} role={role} />,
    admin:        <AdminScreen setScreen={setScreen} />,
    settings:     <SettingsScreen setScreen={setScreen} onLogout={logout} role={role} />,
    fansaved:     <FanSavedScreen setScreen={setScreen} setTrack={setTrack} />,
  };

  return routes[screen] || routes.home;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
