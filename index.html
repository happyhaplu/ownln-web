<head>
  <meta charset="UTF-8" />

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <style>

    ::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes premiumGlow { 0% { box-shadow: 0 0 30px rgba(255,215,0,0.2), 0 10px 40px rgba(0,0,0,0.7), 0 20px 60px rgba(255,215,0,0.05), inset 0 1px 2px rgba(255,255,255,0.08); } 50% { box-shadow: 0 0 50px rgba(255,215,0,0.35), 0 15px 60px rgba(0,0,0,0.8), 0 30px 80px rgba(255,215,0,0.1), inset 0 1px 2px rgba(255,255,255,0.12); } 100% { box-shadow: 0 0 30px rgba(255,215,0,0.2), 0 10px 40px rgba(0,0,0,0.7), 0 20px 60px rgba(255,215,0,0.05), inset 0 1px 2px rgba(255,255,255,0.08); } }
    @keyframes shimmerFlow { 0% { background-position: -300% center; } 100% { background-position: 300% center; } }
    @keyframes floatSoft { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-8px) scale(1.01); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.02); } }
    @keyframes rotateGlow { 0% { filter: hue-rotate(0deg) drop-shadow(0 0 15px rgba(255,215,0,0.4)); } 100% { filter: hue-rotate(10deg) drop-shadow(0 0 20px rgba(255,215,0,0.5)); } }

<div id="root"></div>
<script type="text/babel">

  goldGradient2:'linear-gradient(90deg, #FFD700 0%, #FFED4E 50%, #FFD700 100%)',
  goldShimmer:'linear-gradient(90deg, transparent 0%, rgba(255,215,0,0.3) 50%, transparent 100%)',

/* ── SAMPLE DATA ───────────────────────── */

  { id:5, title:'Renegade Sun',  artist:'Noah Lane',    plays:'760K', duration:'3:22', mood:'Focus',      genre:'Afrobeats' },
];

          { label:'Expertise Market',  sub:'Hire & collaborate',   route:'marketplace',  icon:'🧩' },
  { id:1, title:'The Creator Blueprint', host:'Marcus Allen', episodes:24, description:'Conversations on music ownership, distribution, and independent artist success.' },
  { id:2, title:'Frequency Sessions',    host:'Maya Quinn',   episodes:18, description:'Deep dive producer sessions — from first loop to final master.' },
];
const PODCAST_EPISODES = [
  { id:1, showId:1, season:2, ep:6, title:'Owning Your Masters in 2025',  duration:'54:12', summary:'Marcus and guests break down why owning your masters is the single biggest move you can make as an independent artist.', free:true },
  { id:2, showId:1, season:2, ep:5, title:'Sync Licensing 101',            duration:'48:30', summary:'How to land TV, film, and ad placements to build passive income.', free:true },

  { id:1, title:'Fan subscriptions', amount:'+$340.00', date:'Jun 1',  type:'in',  source:'subscriptions' },
  { id:2, title:'Stream royalties',  amount:'+$284.00', date:'May 28', type:'in',  source:'streaming' },
  { id:3, title:'Track purchases',   amount:'+$96.00',  date:'May 25', type:'in',  source:'purchases' },
  { id:4, title:'Merch sales',       amount:'+$128.00', date:'May 22', type:'in',  source:'merch' },
  { id:5, title:'Ad revenue share',  amount:'+$44.00',  date:'May 18', type:'in',  source:'ads' },
  { id:6, title:'Payout sent',       amount:'-$750.00', date:'May 1',  type:'out', source:'payout' },
];

/* ── HYPERMODERN LUXURY STYLES ─────────────────────── */
const B = {
  screen:{ minHeight:'100vh', background:`radial-gradient(circle at 50% 0%, rgba(255,215,0,0.02) 0%, ${C.bg} 40%)`, color:C.text, display:'flex', flexDirection:'column', animation:'fadeInUp .4s cubic-bezier(0.16, 1, 0.3, 1)' },
  scroll:{ flex:1, overflowY:'auto', paddingBottom:'150px' },
  card:{ background:`linear-gradient(155deg, ${C.card2} 0%, ${C.card} 60%, ${C.card4} 100%)`, border:`1px solid ${C.line}`, borderRadius:24, boxShadow:`0 8px 32px ${C.shadowHeavy}, 0 2px 8px ${C.shadowSoft}, inset 0 1px 0 rgba(255,255,255,0.04)` },
  cardPremium:{ background:`linear-gradient(155deg, ${C.card3} 0%, ${C.card2} 50%, ${C.card} 100%)`, border:`1px solid ${C.lineBright}`, borderRadius:24, boxShadow:`0 12px 48px ${C.shadowHeavy}, 0 0 80px rgba(255,215,0,0.08), inset 0 1px 1px rgba(255,215,0,0.1), inset 0 -1px 1px rgba(0,0,0,0.5)` },

  title:{ fontSize:22, fontWeight:900, marginBottom:16, letterSpacing:-0.8, background:C.goldGradient, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text', fontFamily:'Inter Tight, Inter, sans-serif', textShadow:'0 0 30px rgba(255,215,0,0.2)' },
  goldBtn:{ background:C.goldGradient, color:'#000000', border:'none', borderRadius:40, padding:'18px 32px', fontWeight:900, cursor:'pointer', fontSize:13, boxShadow:'0 8px 32px rgba(255,215,0,0.4), 0 4px 16px rgba(255,140,0,0.3), inset 0 2px 2px rgba(255,255,255,0.3), inset 0 -2px 2px rgba(204,153,0,0.5)', transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', letterSpacing:1, textTransform:'uppercase', position:'relative', overflow:'hidden' },
  outlineBtn:{ background:'rgba(255,215,0,0.04)', color:C.gold, border:`2px solid ${C.gold}`, borderRadius:40, padding:'16px 28px', fontWeight:800, cursor:'pointer', fontSize:12, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', backdropFilter:'blur(30px)', boxShadow:'0 6px 24px rgba(255,215,0,0.15), inset 0 1px 0 rgba(255,215,0,0.1)', letterSpacing:0.8, textTransform:'uppercase' },
  ghostBtn:{ background:'rgba(255,255,255,0.015)', color:C.mutedLight, border:`1px solid ${C.lineDim}`, borderRadius:32, padding:'14px 24px', fontWeight:600, cursor:'pointer', fontSize:12, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', backdropFilter:'blur(20px)', boxShadow:`0 4px 16px ${C.shadowSoft}` },
  input:{ width:'100%', background:'rgba(255,255,255,0.015)', color:C.text, border:`1px solid ${C.line}`, borderRadius:18, padding:'18px 20px', outline:'none', fontSize:14, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', fontWeight:500, boxShadow:`inset 0 4px 12px ${C.shadowSoft}, 0 2px 8px ${C.shadowSoft}` },
  top:{ padding:'60px 20px 20px' },
  pill:{ borderRadius:99, padding:'10px 20px', fontSize:10, fontWeight:800, cursor:'pointer', transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', letterSpacing:0.8, textTransform:'uppercase' },

/* ── SHARED COMPONENTS ─────────────────── */
const Header = ({ title, subtitle, onBack, right }) => (
  <div style={{ ...B.top, display:'flex', alignItems:'center', gap:16 }}>
    {onBack && <button onClick={onBack} style={{ width:46, height:46, borderRadius:99, border:`1.5px solid ${C.lineBright}`, background:`linear-gradient(155deg, ${C.card3}, ${C.card2})`, color:C.goldBright, cursor:'pointer', flexShrink:0, boxShadow:`0 6px 24px ${C.shadowHeavy}, 0 0 30px rgba(255,215,0,0.1), inset 0 1px 0 rgba(255,215,0,0.12)`, fontSize:20, display:'grid', placeItems:'center', transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', fontWeight:900, filter:'drop-shadow(0 0 8px rgba(255,215,0,0.2))' }}>←</button>}
    <div style={{ flex:1 }}>
      <div style={{ fontSize:26, fontWeight:900, letterSpacing:-1.2, fontFamily:'Inter Tight, Inter, sans-serif', background:`linear-gradient(135deg, ${C.goldBright} 0%, ${C.gold} 50%, ${C.goldDark} 100%)`, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', filter:'drop-shadow(0 0 20px rgba(255,215,0,0.4))' }}>{title}</div>
      {subtitle && <div style={{ color:C.mutedLight, fontSize:12, marginTop:4, fontWeight:500, letterSpacing:0.5, opacity:0.9 }}>{subtitle}</div>}
    </div>
    {right}
  </div>
);

const StatusBar = () => (
  <div style={{ display:'flex', justifyContent:'space-between', color:C.muted, fontSize:11, padding:'8px 18px 0' }}>
    <span>9:41</span><span>5G ▪ 89%</span>
  </div>
);

const Tag = ({ label, active, onClick }) => (
  <span onClick={onClick} style={{ ...B.pill, background: active ? C.goldGradient : 'rgba(255,255,255,0.01)', color: active ? '#000000' : C.mutedLight, border: active ? `1.5px solid rgba(255,215,0,0.4)` : `1px solid ${C.lineDim}`, display:'inline-block', boxShadow: active ? '0 6px 28px rgba(255,215,0,0.45), 0 2px 8px rgba(255,140,0,0.3), inset 0 2px 2px rgba(255,255,255,0.3)' : `0 3px 12px ${C.shadowSoft}`, fontWeight: active ? 900 : 700, backdropFilter:'blur(20px)', position:'relative', overflow:'hidden', animation: active ? 'floatSoft 3s ease-in-out infinite' : 'none' }}>
    {active && <span style={{ position:'absolute', inset:0, background:C.goldShimmer, backgroundSize:'200% 100%', animation:'shimmerFlow 3s linear infinite', opacity:0.5 }}></span>}
    <span style={{ position:'relative', zIndex:1 }}>{label}</span>
  </span>
);

const TrackRow = ({ track, onPlay, showLike }) => {
  const [liked, setLiked] = React.useState(false);
  const [hover, setHover] = React.useState(false);
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{ ...B.cardPremium, padding:'16px 18px', marginBottom:14, display:'flex', alignItems:'center', gap:16, cursor:'pointer', transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', transform: hover ? 'translateY(-3px) scale(1.01)' : 'translateY(0) scale(1)', boxShadow: hover ? `0 16px 56px ${C.shadowHeavy}, 0 0 60px rgba(255,215,0,0.15), inset 0 1px 1px rgba(255,215,0,0.15)` : B.cardPremium.boxShadow, border: hover ? `1px solid ${C.lineBright}` : B.cardPremium.border }} onClick={onPlay}>
      <div style={{ width:58, height:58, borderRadius:16, background:`linear-gradient(155deg, rgba(255,244,163,0.2) 0%, rgba(255,215,0,0.15) 50%, rgba(255,140,0,0.1) 100%)`, display:'grid', placeItems:'center', flexShrink:0, color:C.goldBright, fontSize:20, boxShadow:`inset 0 3px 6px rgba(255,215,0,0.2), 0 6px 20px ${C.shadowSoft}, 0 0 30px rgba(255,215,0,0.1)`, border:`1.5px solid rgba(255,215,0,0.15)`, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', transform: hover ? 'scale(1.08)' : 'scale(1)', filter: hover ? 'drop-shadow(0 0 12px rgba(255,215,0,0.4))' : 'none' }}>▶</div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:15, fontWeight:800, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', letterSpacing:-0.4, color:C.textBright, fontFamily:'Inter Tight, Inter, sans-serif' }}>{track.title}</div>
        <div style={{ color:C.mutedLight, fontSize:11, marginTop:5, fontWeight:500, letterSpacing:0.3, opacity:0.85 }}>{track.artist} · {track.plays} plays</div>
      </div>
      <div style={{ display:'flex', gap:14, alignItems:'center', flexShrink:0 }}>
        {showLike && <span onClick={e=>{ e.stopPropagation(); setLiked(!liked); }} style={{ fontSize:20, cursor:'pointer', color: liked ? C.gold : C.mutedLight, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', transform: liked ? 'scale(1.2)' : 'scale(1)', filter: liked ? 'drop-shadow(0 0 12px rgba(255,215,0,0.7))' : 'none', animation: liked ? 'pulse 2s ease-in-out infinite' : 'none' }}>{liked ? '♥' : '♡'}</span>}
        <span style={{ color:C.mutedLight, fontSize:11, fontWeight:800, letterSpacing:0.8, opacity:0.7 }}>{track.duration}</span>
      </div>
    </div>
  );
};

const BottomNav = ({ screen, setScreen, role }) => {
  const tabs = role === 'artist'
    ? [{ id:'home', icon:'⌂', label:'Home' },{ id:'search', icon:'⌕', label:'Discover' },{ id:'library', icon:'▤', label:'Studio' },{ id:'community', icon:'◎', label:'Community' },{ id:'artist', icon:'◉', label:'Profile' }]
    : [{ id:'home', icon:'⌂', label:'Home' },{ id:'search', icon:'⌕', label:'Discover' },{ id:'library', icon:'▤', label:'Library' },{ id:'community', icon:'◎', label:'Community' },{ id:'fanprofile', icon:'◉', label:'Me' }];
  return (
    <div style={{ position:'fixed', bottom:0, width:390, background:'rgba(5,5,5,0.98)', backdropFilter:'blur(50px)', borderTop:`1.5px solid ${C.lineBright}`, padding:'14px 0 22px', display:'flex', justifyContent:'space-around', zIndex:20, boxShadow:`0 -12px 48px ${C.shadowHeavy}, 0 -4px 20px rgba(255,215,0,0.08), inset 0 1px 0 rgba(255,215,0,0.08)` }}>
      {tabs.map(t => {
        const active = t.id === screen;
        return <div key={t.id} onClick={() => setScreen(t.id)} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6, color:active ? C.goldBright : C.mutedLight, fontSize:9, fontWeight:active ? 900 : 700, cursor:'pointer', transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', transform: active ? 'translateY(-2px) scale(1.08)' : 'scale(1)', filter: active ? 'drop-shadow(0 0 16px rgba(255,215,0,0.5))' : 'none', letterSpacing:0.8, textTransform:'uppercase' }}>
          <span style={{ fontSize:24, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', animation: active ? 'pulse 2.5s ease-in-out infinite' : 'none' }}>{t.icon}</span><span style={{ fontWeight: active ? 900 : 600 }}>{t.label}</span>
        </div>;
      })}
    </div>
  );
};

const PersistentPlayer = ({ track, playing, setPlaying, setScreen, panel, setPanel }) => {
  if (!track) return null;
  return (
    <>
      <div style={{ position:'fixed', bottom:84, width:390, background:'rgba(8,8,8,0.98)', backdropFilter:'blur(50px)', borderTop:`1.5px solid ${C.lineBright}`, borderBottom:`1.5px solid ${C.lineBright}`, zIndex:25, padding:'14px 16px', boxShadow:`0 -6px 40px ${C.shadowHeavy}, 0 0 80px rgba(255,215,0,0.1), inset 0 1px 0 rgba(255,215,0,0.1)` }}>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <div onClick={() => setScreen('player')} style={{ width:52, height:52, borderRadius:14, background:`linear-gradient(155deg, rgba(255,244,163,0.25) 0%, rgba(255,215,0,0.18) 50%, rgba(255,140,0,0.12) 100%)`, display:'grid', placeItems:'center', color:C.goldBright, cursor:'pointer', boxShadow:`0 6px 24px rgba(255,215,0,0.25), inset 0 2px 2px rgba(255,255,255,0.15), 0 0 40px rgba(255,215,0,0.15)`, fontSize:18, border:`1.5px solid rgba(255,215,0,0.2)`, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', filter:'drop-shadow(0 0 10px rgba(255,215,0,0.3))' }}>▶</div>
          <div onClick={() => setScreen('player')} style={{ flex:1, minWidth:0, cursor:'pointer' }}>
            <div style={{ fontSize:14, fontWeight:800, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', letterSpacing:-0.4, color:C.textBright, fontFamily:'Inter Tight, Inter, sans-serif' }}>{track.title}</div>
            <div style={{ color:C.mutedLight, fontSize:11, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', marginTop:3, fontWeight:500, letterSpacing:0.3, opacity:0.85 }}>{track.artist}</div>
          </div>
          <div style={{ display:'flex', gap:16, alignItems:'center' }}>
            <button onClick={() => setPanel('queue')} style={{ background:'transparent', border:'none', color:C.mutedLight, cursor:'pointer', fontSize:19, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', opacity:0.7 }}>☰</button>
            <button onClick={() => setPlaying(!playing)} style={{ background:'transparent', border:'none', color:C.goldBright, cursor:'pointer', fontSize:24, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', filter:'drop-shadow(0 0 12px rgba(255,215,0,0.5))', animation: playing ? 'pulse 2s ease-in-out infinite' : 'none' }}>{playing ? '⏸' : '▶'}</button>
            <button onClick={() => setPanel('lyrics')} style={{ background:'transparent', border:'none', color:C.mutedLight, cursor:'pointer', fontSize:19, transition:'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)', opacity:0.7 }}>♫</button>
          </div>
        </div>
        <div style={{ marginTop:12, height:5, borderRadius:8, background:'rgba(255,255,255,0.03)', overflow:'hidden', boxShadow:`inset 0 2px 6px ${C.shadowSoft}` }}><div style={{ width:'38%', height:'100%', background:C.goldGradient, borderRadius:8, boxShadow:'0 0 16px rgba(255,215,0,0.6)', position:'relative', overflow:'hidden' }}><span style={{ position:'absolute', inset:0, background:C.goldShimmer, backgroundSize:'200% 100%', animation:'shimmerFlow 3s linear infinite', opacity:0.4 }}></span></div></div>
      </div>

      {panel && (
        <div style={{ position:'fixed', inset:0, background:'#000000A8', zIndex:40, display:'flex', alignItems:'flex-end' }} onClick={() => setPanel(null)}>
          <div onClick={e => e.stopPropagation()} style={{ width:'100%', background:C.card2, borderTopLeftRadius:20, borderTopRightRadius:20, borderTop:`1px solid ${C.line}`, padding:'14px 16px 20px' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
              <div style={{ fontWeight:800 }}>{panel === 'queue' ? 'Queue' : panel === 'lyrics' ? 'Lyrics' : 'Sleep Timer'}</div>
              <button onClick={() => setPanel(null)} style={{ ...B.ghostBtn, padding:'4px 10px', fontSize:11 }}>Close</button>
            </div>

            {panel === 'queue' && TRACKS.map((item, idx) => (
              <div key={item.id} style={{ ...B.card, padding:10, marginBottom:7, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ display:'flex', gap:9, alignItems:'center' }}>
                  <span style={{ width:14, fontSize:11, color:C.muted }}>{idx + 1}</span>
                  <div>
                    <div style={{ fontSize:12, fontWeight:700 }}>{item.title}</div>
                    <div style={{ color:C.muted, fontSize:10 }}>{item.artist}</div>
                  </div>
                </div>
                <span style={{ color:C.muted, fontSize:10 }}>{item.duration}</span>
              </div>
            ))}

            {panel === 'lyrics' && (
              <div style={{ ...B.card, padding:12, lineHeight:1.8, color:C.muted, fontSize:12 }}>
                <div>Midnight lights and amber skies,</div>
                <div>City echoes, slow replies,</div>
                <div style={{ color:C.gold }}>Hold the moment, keep it near,</div>
                <div>Every heartbeat crystal clear.</div>
              </div>
            )}

            {panel === 'sleep' && (
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
                {['15 min','30 min','45 min','60 min','End of song','Off'].map(opt => (
                  <button key={opt} style={{ ...B.ghostBtn, padding:'10px 8px', fontSize:11 }}>{opt}</button>
                ))}
              </div>
            )}

            <button onClick={() => setPanel('sleep')} style={{ ...B.outlineBtn, width:'100%', marginTop:10 }}>Sleep Timer</button>
          </div>
        </div>
      )}
    </>
  );
};

══════════════════════════════════════════════════ */
const PlayerScreen = ({ setScreen, track, role }) => {
  const [playing, setPlaying] = React.useState(true);
  const [liked, setLiked] = React.useState(false);
  const [saved, setSaved] = React.useState(false);
  const t = track || TRACKS[0];
  return (
    <div style={{ ...B.screen, background:`linear-gradient(180deg,${C.goldBg} 0%,${C.bg} 40%)` }}>
      <Header title="Now Playing" onBack={() => setScreen(role === 'artist' ? 'artist' : 'home')} right={
        <button style={{ ...B.ghostBtn, padding:'6px 12px' }} onClick={() => setScreen('subscribe')}>+ Subscribe</button>
      }/>
      <div style={{ ...B.scroll, padding:'4px 22px 24px' }}>
        <div style={{ aspectRatio:'1', borderRadius:20, border:`1px solid ${C.goldDim}`, background:`linear-gradient(135deg,#2A1F00,#1A1A1A,#111)`, display:'grid', placeItems:'center', marginBottom:18 }}>
          <div style={{ width:160, height:160, borderRadius:'50%', border:`1px solid ${C.goldDim}`, display:'grid', placeItems:'center' }}>
            <div style={{ width:75, height:75, borderRadius:'50%', border:`1px solid ${C.goldDim}`, display:'grid', placeItems:'center' }}>
              <div style={{ width:22, height:22, borderRadius:'50%', background:C.gold }}></div>
            </div>
          </div>
        </div>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:14 }}>
          <div>
            <div style={{ fontSize:24, fontWeight:900 }}>{t.title}</div>
            <div style={{ color:C.muted, fontSize:13 }}>{t.artist}</div>
            <div style={{ display:'flex', gap:6, marginTop:6 }}>
              <span style={{ ...B.pill, background:C.card, color:C.muted, border:`1px solid ${C.line}`, fontSize:10 }}>{t.mood}</span>
              <span style={{ ...B.pill, background:C.card, color:C.muted, border:`1px solid ${C.line}`, fontSize:10 }}>{t.genre}</span>
            </div>
          </div>
          <div style={{ display:'flex', gap:10, paddingTop:4 }}>
            <span onClick={() => setLiked(!liked)} style={{ fontSize:22, cursor:'pointer', color: liked ? C.gold : C.muted }}>{liked ? '♥' : '♡'}</span>
            <span onClick={() => setSaved(!saved)} style={{ fontSize:20, cursor:'pointer', color: saved ? C.gold : C.muted }}>🔖</span>
            <span style={{ fontSize:18, cursor:'pointer', color:C.muted }}>↗</span>
          </div>
        </div>
        <div style={{ height:4, borderRadius:3, background:C.line, marginBottom:6 }}>
          <div style={{ width:'37%', height:'100%', background:C.gold, borderRadius:3 }}></div>
        </div>
        <div style={{ display:'flex', justifyContent:'space-between', color:C.muted, fontSize:11, marginBottom:20 }}><span>1:24</span><span>{t.duration}</span></div>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18 }}>
          <span style={{ color:C.muted, fontSize:18, cursor:'pointer' }}>⤮</span>
          <button style={{ background:'transparent', border:`1px solid ${C.line}`, borderRadius:'50%', width:42, height:42, color:C.text, cursor:'pointer', fontSize:16 }}>⏮</button>
          <button onClick={() => setPlaying(!playing)} style={{ width:70, height:70, borderRadius:'50%', border:'none', background:C.gold, display:'grid', placeItems:'center', animation:'glow 2s ease infinite', fontSize:24, cursor:'pointer' }}>
            {playing ? '⏸' : '▶'}
          </button>
          <button style={{ background:'transparent', border:`1px solid ${C.line}`, borderRadius:'50%', width:42, height:42, color:C.text, cursor:'pointer', fontSize:16 }}>⏭</button>
          <span style={{ color:C.muted, fontSize:18, cursor:'pointer' }}>↻</span>
        </div>
        <button onClick={() => setScreen('library')} style={{ ...B.ghostBtn, width:'100%', marginBottom:8 }}>+ Add to Playlist</button>
        <button style={{ ...B.ghostBtn, width:'100%' }}>Show Lyrics</button>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════
   PODCAST — Show → Season → Episode → Detail
══════════════════════════════════════════════════ */
const PodcastScreen = ({ setScreen, role }) => {
  const [view, setView] = React.useState('shows');
  const [show, setShow] = React.useState(null);
  const [episode, setEpisode] = React.useState(null);
  const [activeSeason, setActiveSeason] = React.useState(2);

  if (view === 'detail' && episode) return (
    <div style={B.screen}>
      <Header title={episode.title} subtitle={`S${episode.season} · E${episode.ep} · ${episode.duration}`} onBack={() => setView('episodes')} />
      <div style={{ ...B.scroll, padding:'0 16px 24px' }}>
        <div style={{ ...B.goldCard, padding:14, marginBottom:14 }}>
          <div style={{ display:'flex', gap:10, alignItems:'center' }}>
            {!episode.free && <span style={{ ...B.pill, background:C.gold, color:C.bg, fontSize:10 }}>PRO</span>}
            {episode.free && <span style={{ ...B.pill, background:'#1A2A1A', color:C.success, border:`1px solid ${C.success}`, fontSize:10 }}>FREE</span>}
            <span style={{ color:C.muted, fontSize:11 }}>{episode.duration}</span>
          </div>
          <div style={{ fontSize:18, fontWeight:800, marginTop:8 }}>{episode.title}</div>
          <div style={{ color:C.muted, fontSize:12, marginTop:4 }}>{show && show.title}</div>
        </div>
        <div style={{ ...B.card, padding:14, marginBottom:14 }}>
          <div style={{ fontWeight:700, marginBottom:6 }}>Episode Summary</div>
          <div style={{ color:C.muted, fontSize:13, lineHeight:1.6 }}>{episode.summary}</div>
        </div>
        {episode.free
          ? <button style={{ ...B.goldBtn, width:'100%', animation:'glow 2s ease infinite' }}>▶ Play Full Episode</button>
          : <div>
              <div style={{ ...B.card, padding:12, marginBottom:10, borderColor:C.goldDim }}>
                <div style={{ color:C.gold, fontWeight:700 }}>Pro Exclusive</div>
                <div style={{ color:C.muted, fontSize:12, marginTop:4 }}>Subscribe to unlock this and all exclusive episodes.</div>
              </div>
              <button onClick={() => setScreen('subscribe')} style={{ ...B.goldBtn, width:'100%' }}>Unlock with Pro Subscription</button>
              <button style={{ ...B.ghostBtn, width:'100%', marginTop:8 }}>▶ Preview Clip (2 min)</button>
            </div>}
      </div>
    </div>
  );

  if (view === 'episodes' && show) {
    const seasons = [...new Set(PODCAST_EPISODES.filter(e => e.showId === show.id).map(e => e.season))].sort((a,b) => b-a);
    const eps = PODCAST_EPISODES.filter(e => e.showId === show.id && e.season === activeSeason);
    return (
      <div style={B.screen}>
        <Header title={show.title} subtitle={`by ${show.host} · ${show.episodes} episodes`} onBack={() => setView('shows')} />
        <div style={{ ...B.scroll, padding:'0 16px 24px' }}>
          <div style={{ ...B.goldCard, padding:12, marginBottom:14 }}>
            <div style={{ color:C.muted, fontSize:12 }}>{show.description}</div>
            <div style={{ display:'flex', gap:8, marginTop:10 }}>
              <button style={{ ...B.goldBtn, flex:1, padding:'9px 0' }}>▶ Play Latest</button>
              <button style={{ ...B.outlineBtn, flex:1, padding:'9px 0' }}>+ Follow Show</button>
            </div>
          </div>
          <div style={{ marginBottom:12 }}>
            <div style={{ fontWeight:700, fontSize:13, marginBottom:8 }}>Season</div>
            <div style={{ display:'flex', gap:8 }}>
              {seasons.map(s => <Tag key={s} label={`Season ${s}`} active={activeSeason===s} onClick={() => setActiveSeason(s)} />)}
            </div>
          </div>
          <div style={B.title}>Episodes — Season {activeSeason}</div>
          {eps.map(ep => (
            <div key={ep.id} onClick={() => { setEpisode(ep); setView('detail'); }} style={{ ...B.card, padding:12, marginBottom:8, cursor:'pointer' }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                <div style={{ flex:1 }}>
                  <div style={{ display:'flex', gap:6, marginBottom:4 }}>
                    <span style={{ color:C.muted, fontSize:11 }}>E{ep.ep}</span>
                    {!ep.free && <span style={{ ...B.pill, background:C.goldBg, color:C.gold, fontSize:9, padding:'2px 7px' }}>PRO</span>}
                  </div>
                  <div style={{ fontSize:13, fontWeight:700 }}>{ep.title}</div>
                  <div style={{ color:C.muted, fontSize:11, marginTop:2 }}>{ep.duration}</div>
                </div>
                <span style={{ color:C.gold, fontSize:18 }}>▶</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div style={B.screen}>
      <Header title="Podcasts & Film" subtitle="Long-form audio & video storytelling" onBack={() => setScreen('library')} />
      <div style={{ ...B.scroll, padding:'0 16px 24px' }}>
        <div style={{ ...B.card, padding:11, marginBottom:14 }}>
          <div style={{ color:C.muted, fontSize:12 }}>Creator-hosted shows, behind-the-scenes series, and documentary-style films. Free episodes for all. Exclusive content for subscribers.</div>
        </div>
        <div style={B.title}>All Shows</div>
        {PODCAST_SHOWS.map(s => (
          <div key={s.id} onClick={() => { setShow(s); setView('episodes'); }} style={{ ...B.card, padding:14, marginBottom:10, cursor:'pointer' }}>
            <div style={{ display:'flex', gap:12, alignItems:'center' }}>
              <div style={{ width:54, height:54, borderRadius:12, background:`linear-gradient(135deg,${C.goldDim},#111)`, display:'grid', placeItems:'center', flexShrink:0, color:C.gold, fontSize:20 }}>🎙</div>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:800, fontSize:14 }}>{s.title}</div>
                <div style={{ color:C.muted, fontSize:12, marginTop:2 }}>Hosted by {s.host}</div>
                <div style={{ color:C.muted, fontSize:11, marginTop:1 }}>{s.episodes} episodes · Multiple seasons</div>
              </div>
              <span style={{ color:C.gold }}>›</span>
            </div>
          </div>
        ))}
        {role === 'artist' && (
          <div style={{ marginTop:10 }}>
            <div style={B.title}>Your Shows</div>
            <button onClick={() => setScreen('upload')} style={{ ...B.outlineBtn, width:'100%' }}>+ Create New Show</button>
          </div>
        )}
      </div>
      <BottomNav screen="library" setScreen={setScreen} role={role} />
    </div>
  );
};

/* ══════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════ */
const App = () => {
  const [authed, setAuthed] = React.useState(false);
  const [role, setRole] = React.useState(null);
  const [screen, setScreen] = React.useState('home');
  const [track, setTrack] = React.useState(TRACKS[0]);
  const [playing, setPlaying] = React.useState(true);
  const [playerPanel, setPlayerPanel] = React.useState(null);

  const logout = () => { setAuthed(false); setRole(null); setScreen('home'); };

  if (!authed) return <AuthScreen onDone={r => { setRole(r); setAuthed(true); setScreen('home'); }} />;

  const sp = { setScreen, setTrack, role };

  const routes = {
    home:         role === 'artist' ? <ArtistHomeScreen {...sp} /> : <FanHomeScreen {...sp} />,
    search:       <SearchScreen {...sp} />,
    library:      role === 'artist' ? <ArtistLibraryScreen {...sp} /> : <FanLibraryScreen {...sp} />,
    community:    <CommunityScreen {...sp} />,
    marketplace:  <MarketplaceScreen setScreen={setScreen} />,
    producerconnect:<ProducerConnectScreen setScreen={setScreen} />,
    arhub:        <ArHubScreen setScreen={setScreen} />,
    collabhub:    <CollabHubScreen setScreen={setScreen} />,
    ownlnlive:    <OwnlnLiveScreen setScreen={setScreen} />,
    fanclubs:     <FanClubsScreen setScreen={setScreen} />,
    artist:       <ArtistScreen setScreen={setScreen} setTrack={setTrack} />,
    fanprofile:   <FanProfileScreen setScreen={setScreen} />,
    artistpublic: <ArtistPublicScreen setScreen={setScreen} setTrack={setTrack} />,
    player:       <PlayerScreen setScreen={setScreen} track={track} role={role} />,
    opi:          <OpiScreen setScreen={setScreen} />,
    wallet:       <WalletScreen setScreen={setScreen} />,
    subscribe:    <SubscribeScreen setScreen={setScreen} role={role} />,
    upload:       <UploadScreen setScreen={setScreen} />,
    streamingops: <StreamingOpsScreen setScreen={setScreen} />,
    podcast:      <PodcastScreen setScreen={setScreen} role={role} />,
    education:    <EducationScreen setScreen={setScreen} />,
    merch:        <MerchScreen setScreen={setScreen} />,
    approval:     <ApprovalQueueScreen setScreen={setScreen} />,
    features:     <FeaturesScreen setScreen={setScreen} />,
    fanfare:      <FanfareScreen setScreen={setScreen} />,
    networking:   <NetworkingScreen setScreen={setScreen} />,
    notifications:<NotificationsScreen setScreen={setScreen} role={role} />,
    admin:        <AdminScreen setScreen={setScreen} />,
    settings:     <SettingsScreen setScreen={setScreen} onLogout={logout} role={role} />,
    fansaved:     <FanSavedScreen setScreen={setScreen} setTrack={setTrack} />,
  };

  const view = routes[screen] || routes.home;
  const showMiniPlayer = !['player'].includes(screen);

  return (
    <>
      {view}
      {showMiniPlayer && (
        <PersistentPlayer
          track={track}
          playing={playing}
          setPlaying={setPlaying}
          setScreen={setScreen}
          panel={playerPanel}
          setPanel={setPlayerPanel}
        />
      )}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
