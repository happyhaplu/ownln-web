    <div style={{ position:'fixed', bottom:0, width:390, background:'rgba(5,5,5,0.98)', backdropFilter:'blur(50px)', borderTop:`1.5px solid ${C.lineBright}`, padding:'16px 0 24px', display:'flex', justifyContent:'space-around', zIndex:20, boxShadow:`0 -12px 48px ${C.shadowHeavy}, 0 -4px 20px rgba(255,215,0,0.08), inset 0 1px 0 rgba(255,215,0,0.08)` }}>

                  <div style={{ fontSize:13, fontWeight:700 }}>{ep.title}</div>
                  <div style={{ color:C.muted, fontSize:11, marginTop:2 }}>{ep.duration}</div>

                <span style={{ color:C.gold, fontSize:18 }}>▶</span>

            </div>
          ))}

      </div>

        return (
          <div>
            <div style={{ fontSize:24, fontWeight:900, fontFamily:'Inter Tight, Inter, sans-serif', background:C.goldGradient, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', marginBottom:12, letterSpacing:-0.8, textAlign:'center' }}>Music Moods</div>
            <div style={{ color:C.mutedLight, fontSize:13, marginBottom:24, lineHeight:1.6, textAlign:'center' }}>Choose moods that match your vibe</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
              {MOODS.map(m => (
                <span key={m} style={{ ...B.pill, background:'rgba(199,154,58,0.08)', color:C.goldBright, border:`1.5px solid ${C.lineBright}` }}>{m}</span>
              ))}
            </div>
          </div>
        );
      case 3:
        return (
          <div>
            <div style={{ fontSize:24, fontWeight:900, fontFamily:'Inter Tight, Inter, sans-serif', background:C.goldGradient, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', marginBottom:12, letterSpacing:-0.8, textAlign:'center' }}>Follow Artists</div>
            <div style={{ color:C.mutedLight, fontSize:13, marginBottom:24, lineHeight:1.6, textAlign:'center' }}>Start following artists to see their latest releases</div>
            {['Marcus Allen', 'Maya Quinn', 'Ari Vega', 'Noah Lane'].map(artist => (
              <div key={artist} style={{ ...B.cardPremium, padding:'16px 18px', marginBottom:12, display:'flex', alignItems:'center', gap:14 }}>
                <div style={{ width:48, height:48, borderRadius:99, background:`linear-gradient(135deg,${C.gold},#8A6A18)`, display:'grid', placeItems:'center', fontWeight:900, color:C.bg, fontSize:16, flexShrink:0 }}>{artist[0]}</div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:800, fontFamily:'Inter Tight, Inter, sans-serif' }}>{artist}</div>
                  <div style={{ color:C.mutedLight, fontSize:11, marginTop:2 }}>R&B / Soul</div>
                </div>
                <button style={{ ...B.goldBtn, padding:'8px 16px', fontSize:10 }}>FOLLOW</button>
              </div>
            ))}
          </div>
        );
    }
  };

  return (
    <div style={B.screen}>
      <div style={{ padding:'60px 20px 20px' }}>
        <div style={{ marginBottom:32 }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
            <span style={{ fontSize:11, fontWeight:700, color:C.mutedLight, letterSpacing:0.8 }}>STEP {step} OF {totalSteps}</span>
            <span style={{ fontSize:11, fontWeight:700, color:C.gold, letterSpacing:0.8 }}>{Math.round(progress)}%</span>
          </div>
          <div style={{ height:6, background:C.card2, borderRadius:99, overflow:'hidden' }}>
            <div style={{ height:'100%', background:C.goldGradient, width:`${progress}%`, transition:'width 0.4s cubic-bezier(0.16, 1, 0.3, 1)', borderRadius:99 }}></div>
          </div>
        </div>
      </div>
      <div style={{ ...B.scroll, padding:'0 20px 24px' }}>
        <div style={{ ...B.goldCard, padding:32, marginBottom:24, position:'relative', overflow:'hidden' }}>
          <span style={{ position:'absolute', inset:0, background:C.goldShimmer, backgroundSize:'200% 100%', animation:'shimmerFlow 4s linear infinite', opacity:0.1, pointerEvents:'none' }}></span>
          <div style={{ position:'relative', zIndex:1 }}>
            {renderStep()}
          </div>
        </div>
        <div style={{ display:'flex', gap:12 }}>
          {step > 1 && <button onClick={() => setStep(step - 1)} style={{ ...B.outlineBtn, flex:1, fontSize:12, padding:'16px' }}>BACK</button>}
          <button onClick={() => step < totalSteps ? setStep(step + 1) : onComplete()} style={{ ...B.goldBtn, flex:1, fontSize:12, padding:'16px' }}>
            <span style={{ position:'relative', zIndex:1 }}>{step === totalSteps ? 'START EXPLORING' : 'NEXT'}</span>
          </button>
        </div>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════ */
const App = () => {
  const [authed, setAuthed] = React.useState(false);
  const [role, setRole] = React.useState(null);
  const [screen, setScreen] = React.useState('home');
  const [track, setTrack] = React.useState(TRACKS[0]);
  const [playing, setPlaying] = React.useState(true);
  const [playerPanel, setPlayerPanel] = React.useState(null);

  const logout = () => { setAuthed(false); setRole(null); setScreen('home'); };

  if (!authed) return <AuthScreen onDone={r => { setRole(r); setAuthed(true); setScreen('home'); }} />;

  const sp = { setScreen, setTrack, role };

  const routes = {
    home:         role === 'artist' ? <ArtistHomeScreen {...sp} /> : <FanHomeScreen {...sp} />,
    search:       <SearchScreen {...sp} />,
    library:      role === 'artist' ? <ArtistLibraryScreen {...sp} /> : <FanLibraryScreen {...sp} />,
    community:    <CommunityScreen {...sp} />,
    marketplace:  <MarketplaceScreen setScreen={setScreen} />,
    producerconnect:<ProducerConnectScreen setScreen={setScreen} />,
    arhub:        <ArHubScreen setScreen={setScreen} />,
    collabhub:    <CollabHubScreen setScreen={setScreen} />,
    ownlnlive:    <OwnlnLiveScreen setScreen={setScreen} />,
    fanclubs:     <FanClubsScreen setScreen={setScreen} />,
    artist:       <ArtistScreen setScreen={setScreen} setTrack={setTrack} />,
    fanprofile:   <FanProfileScreen setScreen={setScreen} />,
    artistpublic: <ArtistPublicScreen setScreen={setScreen} setTrack={setTrack} />,
    player:       <PlayerScreen setScreen={setScreen} track={track} role={role} />,
    opi:          <OpiScreen setScreen={setScreen} />,
    wallet:       <WalletScreen setScreen={setScreen} />,
    subscribe:    <SubscribeScreen setScreen={setScreen} role={role} />,
    upload:       <UploadScreen setScreen={setScreen} />,
    streamingops: <StreamingOpsScreen setScreen={setScreen} />,
    podcast:      <PodcastScreen setScreen={setScreen} role={role} />,
    education:    <EducationScreen setScreen={setScreen} />,
    merch:        <MerchScreen setScreen={setScreen} />,
    approval:     <ApprovalQueueScreen setScreen={setScreen} />,
    features:     <FeaturesScreen setScreen={setScreen} />,
    fanfare:      <FanfareScreen setScreen={setScreen} />,
    networking:   <NetworkingScreen setScreen={setScreen} />,
    notifications:<NotificationsScreen setScreen={setScreen} role={role} />,
    admin:        <AdminScreen setScreen={setScreen} />,
    settings:     <SettingsScreen setScreen={setScreen} onLogout={logout} role={role} />,
    fansaved:     <FanSavedScreen setScreen={setScreen} setTrack={setTrack} />,
    playlist:     <PlaylistScreen setScreen={setScreen} setTrack={setTrack} />,
    episode:      <EpisodePageScreen setScreen={setScreen} />,
    scheduling:   <ReleaseSchedulingScreen setScreen={setScreen} />,
    artistonboarding: <ArtistOnboardingScreen setScreen={setScreen} onComplete={() => setScreen('home')} />,
    fanonboarding: <FanOnboardingScreen setScreen={setScreen} onComplete={() => setScreen('home')} />,
    artistmerch:  <ArtistMerchStoreScreen setScreen={setScreen} />,
  };

  const view = routes[screen] || routes.home;
  const showMiniPlayer = !['player'].includes(screen);

  return (
    <>
      {view}
      {showMiniPlayer && (
        <PersistentPlayer
          track={track}
          playing={playing}
          setPlaying={setPlaying}
          setScreen={setScreen}
          panel={playerPanel}
          setPanel={setPlayerPanel}
        />
      )}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
